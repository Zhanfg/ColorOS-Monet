[package]
name = "coloros-monetctl"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "APK-free ColorOS Monet component manager"

[[bin]]
name = "monetctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.12"
walkdir = "2.5"
zstd = "0.13"

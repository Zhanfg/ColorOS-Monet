name: Verify Material Symbols upstream

on:
  push:
    branches:
      - "coloros17-md3e-v0.2.0"
    paths:
      - "compat/material-symbols/upstream.lock"
      - "compat/material-symbols/coloros_icon_map.tsv"
      - "compat/coloros17/settings_oplus_homepage_icons.tsv"
      - "compat/material-symbols/settings_homepage_full_source_map.tsv"
      - "compat/material-symbols/coloros17_settings_expressive_wrappers.tsv"
      - "tools/validate_settings_homepage_source_map.py"
      - "tools/validate_oplus_homepage_icon_candidates.py"
      - "tools/verify_aosp_settings_upstream.py"
      - "tools/build_oplus_homepage_icon_review_pack.py"
      - "compat/material-symbols/aosp-settings.source"
      - "tools/verify_material_symbols_upstream_api.py"
      - "tools/resolve_coloros17_icon_sources.py"
      - "tools/suggest_material_symbol_matches.py"
      - "tools/materialize_material_symbol_assets.py"
      - ".github/workflows/material-symbols-upstream.yml"
  workflow_dispatch:

concurrency:
  group: material-symbols-upstream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ColorOS-Monet
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate icon-mapping tools
        run: |
          python -m py_compile \
            tools/verify_material_symbols_upstream_api.py \
            tools/resolve_coloros17_icon_sources.py \
            tools/suggest_material_symbol_matches.py \
            tools/materialize_material_symbol_assets.py \
            tools/validate_oplus_homepage_icon_candidates.py \
            tools/verify_aosp_settings_upstream.py \
            tools/verify_setupdesign_upstream.py \
            tools/audit_aosp_settings_expressive_drift.py \
            tools/build_oplus_homepage_icon_review_pack.py \
            tools/validate_settings_homepage_source_map.py \
            tools/lint_coloros17_settings_expressive_wrappers.py

      - name: Verify pinned Google Material Symbols through GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/verify_material_symbols_upstream_api.py
          --lock compat/material-symbols/upstream.lock
          --mapping compat/material-symbols/coloros_icon_map.tsv
          --catalog-output dist/material-symbols-catalog.tsv
          --capabilities-output dist/material-symbols-mapped-capabilities.tsv

      - name: Verify Android 17 AOSP Settings Expressive upstream
        run: >-
          python tools/verify_aosp_settings_upstream.py
          --source compat/material-symbols/aosp-settings.source
          --output dist/aosp-settings-upstream.lock

      - name: Verify Android 17 SetupDesign Expressive upstream
        run: >-
          python tools/verify_setupdesign_upstream.py
          --source compat/material-symbols/setupdesign.source
          --output dist/setupdesign-upstream.lock

      - name: Audit Android 17 Settings Expressive drift
        run: >-
          python tools/audit_aosp_settings_expressive_drift.py
          --source compat/material-symbols/aosp-settings.source
          --output dist/aosp-settings-expressive-drift.md

      - name: Build ColorOS icon source-resolution table
        run: >-
          python tools/resolve_coloros17_icon_sources.py
          --native-pairs compat/material-symbols/native_expressive_pairs.tsv
          --native-map compat/material-symbols/native_expressive_map.tsv
          --material-map compat/material-symbols/coloros_icon_map.tsv
          --native-provenance compat/material-symbols/native_expressive_provenance.tsv
          --oplus-homepage compat/coloros17/settings_oplus_homepage_icons.tsv
          --output dist/coloros17-icon-resolution.tsv

      - name: Build OPlus homepage Material Symbols review pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/build_oplus_homepage_icon_review_pack.py
          --homepage compat/coloros17/settings_oplus_homepage_icons.tsv
          --upstream-lock compat/material-symbols/upstream.lock
          --output dist/oplus-homepage-material-review

      - name: Validate OPlus homepage icon candidates
        run: >-
          python tools/validate_oplus_homepage_icon_candidates.py
          --homepage compat/coloros17/settings_oplus_homepage_icons.tsv
          --catalog dist/material-symbols-catalog.tsv
          --native-pairs compat/material-symbols/native_expressive_pairs.tsv
          --native-map compat/material-symbols/native_expressive_map.tsv
          --native-unmatched compat/material-symbols/native_expressive_unmatched.tsv

      - name: Validate complete OPlus homepage source map
        run: >-
          python tools/validate_settings_homepage_source_map.py
          --table compat/material-symbols/settings_homepage_full_source_map.tsv
          --catalog dist/material-symbols-catalog.tsv

      - name: Validate current-target Settings Expressive wrappers
        run: >-
          python tools/lint_coloros17_settings_expressive_wrappers.py
          --homepage compat/material-symbols/settings_homepage_full_source_map.tsv
          --wrappers compat/material-symbols/coloros17_settings_expressive_wrappers.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: material-symbols-verified-${{ github.sha }}
          path: |
            dist/material-symbols-catalog.tsv
            dist/material-symbols-mapped-capabilities.tsv
            dist/coloros17-icon-resolution.tsv
            dist/aosp-settings-upstream.lock
            dist/setupdesign-upstream.lock
            dist/aosp-settings-expressive-drift.md
            dist/oplus-homepage-material-review/**

name: Verify Material Symbols upstream

on:
  push:
    branches:
      - "coloros17-md3e-v0.2.0"
    paths:
      - "compat/material-symbols/upstream.lock"
      - "compat/material-symbols/coloros_icon_map.tsv"
      - "tools/verify_material_symbols_upstream_api.py"
      - ".github/workflows/material-symbols-upstream.yml"
  workflow_dispatch:

concurrency:
  group: material-symbols-upstream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ColorOS-Monet
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pinned Google Material Symbols through GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/verify_material_symbols_upstream_api.py
          --lock compat/material-symbols/upstream.lock
          --mapping compat/material-symbols/coloros_icon_map.tsv
          --catalog-output dist/material-symbols-catalog.tsv
          --capabilities-output dist/material-symbols-mapped-capabilities.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: material-symbols-verified-${{ github.sha }}
          path: |
            dist/material-symbols-catalog.tsv
            dist/material-symbols-mapped-capabilities.tsv

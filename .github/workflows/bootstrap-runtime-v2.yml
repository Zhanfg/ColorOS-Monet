name: Bootstrap Runtime V2

on:
  push:
    branches: [feat/rust-component-runtime]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rust-component-runtime
          fetch-depth: 0

      - name: Reconstruct and verify audited source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/runtime-v2-source.tar.xz.part-* > /tmp/runtime-v2-source.tar.xz
          echo '05e767c88489f5a20a61198f540b66c3758bfb5800bdcc4b009095b6983d7b63  /tmp/runtime-v2-source.tar.xz' | sha256sum -c -
          tar -tJf /tmp/runtime-v2-source.tar.xz >/dev/null

      - name: Preserve reviewed application mappings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/coloros-monet-mappings
          cp -a overlays/x/mapping /tmp/coloros-monet-mappings/x
          cp -a overlays/tim/mapping /tmp/coloros-monet-mappings/tim
          cp -a overlays/coolapk/mapping /tmp/coloros-monet-mappings/coolapk

      - name: Replace legacy base with Rust component runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf module docs tools runtime components overlays
          tar -xJf /tmp/runtime-v2-source.tar.xz
          mkdir -p components/app-mappings/x components/app-mappings/tim components/app-mappings/coolapk
          cp -a /tmp/coloros-monet-mappings/x/. components/app-mappings/x/
          cp -a /tmp/coloros-monet-mappings/tim/. components/app-mappings/tim/
          cp -a /tmp/coloros-monet-mappings/coolapk/. components/app-mappings/coolapk/
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-runtime-v2.yml

      - name: Validate materialized source tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_repository.py
          python tools/materialize_component_specs.py --output /tmp/materialized-components
          test "$(find /tmp/materialized-components -name component.json | wc -l)" -eq 37
          test "$(find components/app-mappings -name '*.tsv' -type f | wc -l)" -ge 3
          test "$(grep -hEv '^(#|$)' components/app-mappings/*/*.tsv | wc -l)" -gt 0

      - name: Commit materialized runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: materialize Rust component runtime v2'
          git push origin HEAD:feat/rust-component-runtime

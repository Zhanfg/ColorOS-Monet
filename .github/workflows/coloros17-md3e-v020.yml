name: ColorOS 17 MD3E v0.2.0 build

on:
  push:
    branches:
      - "coloros17-md3e-v0.2.0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate sources
        shell: bash
        run: |
          python -m py_compile             tools/build_overlays.py             tools/package_module.py             tools/build_coloros17_native_restore.py             tools/build_coloros17_semantic_accent.py             tools/classify_legacy_overlay_resources.py
          bash -n             module/customize.sh             module/service.sh             module/action.sh             module/uninstall.sh             module/bin/coloros17-expressive-style

      - name: Install Android SDKs
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3             "platforms;android-35" "build-tools;35.0.0"             "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build migration-only native foundation
        run: >-
          python tools/build_coloros17_native_restore.py
          --version 0.2.0-alpha2
          --version-code 26100330
          --output dist/ColorOS17-NativeFoundation-P0P1.zip

      - name: Build conservative MD3E semantic accent layer
        run: >-
          python tools/build_coloros17_semantic_accent.py
          --version 0.2.0-alpha2
          --version-code 26100330
          --output dist/ColorOS17-MD3E-SemanticAccent.zip

      - name: Package clean ColorOS 17 module
        run: >-
          python tools/package_module.py
          --variant debug
          --version 0.2.0-alpha2
          --version-code 26100330
          --semantic-accent-dir dist/semantic-accent
          --output dist/ColorOS-Monet-v0.2.0-alpha2-COS17-clean.zip

      - name: Verify clean package boundaries
        shell: bash
        run: |
          unzip -l dist/ColorOS-Monet-v0.2.0-alpha2-COS17-clean.zip > dist/module-files.txt
          grep -q 'payload/semantic-accent-manifest.tsv' dist/module-files.txt
          if grep -q 'payload/native-foundation-manifest.tsv' dist/module-files.txt; then
            echo "native foundation must remain migration-only and not ship in the clean module"
            exit 1
          fi

      - name: Hash artifacts
        shell: bash
        run: |
          sha256sum             dist/ColorOS17-NativeFoundation-P0P1.zip             dist/ColorOS17-MD3E-SemanticAccent.zip             dist/ColorOS-Monet-v0.2.0-alpha2-COS17-clean.zip             > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-MD3E-v0.2.0-alpha2
          path: |
            dist/ColorOS-Monet-v0.2.0-alpha2-COS17-clean.zip
            dist/ColorOS17-MD3E-SemanticAccent.zip
            dist/ColorOS17-NativeFoundation-P0P1.zip
            dist/SHA256SUMS
            dist/module-files.txt
            dist/semantic-accent/*.apk
            dist/semantic-accent/semantic-accent-manifest.tsv
            dist/native-foundation/*.apk
            dist/native-foundation/native-foundation-manifest.tsv

name: Android 17 full compatibility overlays

on:
  push:
    branches:
      - "android17-compat-*"
    paths:
      - "tools/build_coloros17_fullcompat.py"
      - ".github/workflows/android17-fullcompat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 17 SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build full compatibility overlays
        run: >-
          python tools/build_coloros17_fullcompat.py
          --version 0.1.5
          --version-code 26100315
          --output dist/ColorOS17-FullCompat-Overlays.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-FullCompat-Overlays
          path: |
            dist/ColorOS17-FullCompat-Overlays.zip
            dist/cos17-overlays/*.apk
            dist/cos17-overlays/compat-manifest.tsv

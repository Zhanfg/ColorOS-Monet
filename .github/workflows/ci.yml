name: CI

on:
  push:
    branches: [main, feat/rust-component-runtime]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Static validation
        run: |
          python -m py_compile tools/*.py
          python tools/audit_repository.py
          python tools/validate_mappings.py
          shellcheck module/customize.sh module/post-fs-data.sh module/service.sh module/action.sh module/uninstall.sh module/META-INF/com/google/android/update-binary

      - name: Test Rust runtime
        run: |
          cargo fmt --manifest-path runtime/Cargo.toml --check
          cargo clippy --manifest-path runtime/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path runtime/Cargo.toml
          cargo build --manifest-path runtime/Cargo.toml --release

      - name: Materialize component sources
        run: python tools/build_component_sources.py

      - name: Compile independent assets to Android Binary XML
        run: |
          python tools/compile_component_assets.py \
            --sources build/component-src \
            --output build/component-compiled \
            --aapt2 "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" \
            --android-jar "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"

      - name: Build and audit CMONET01 components
        run: |
          python tools/build_components.py \
            --monetctl runtime/target/release/monetctl \
            --sources build/component-compiled \
            --output build/components
          python tools/audit_components.py build/components

      - name: Cross-compile ARM64 Android runtime
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo build --manifest-path runtime/Cargo.toml --release --target aarch64-linux-android

      - name: Package and audit module
        run: |
          mkdir -p dist
          python tools/package_module.py \
            --runtime runtime/target/aarch64-linux-android/release/monetctl \
            --components build/components \
            --version dev-${{ github.run_number }} \
            --version-code ${{ github.run_number }} \
            --output dist/ColorOS-Monet-v2-dev.zip
          python tools/audit_module.py dist/ColorOS-Monet-v2-dev.zip
          sha256sum dist/ColorOS-Monet-v2-dev.zip > dist/ColorOS-Monet-v2-dev.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-Monet-v2-debug
          path: |
            dist/ColorOS-Monet-v2-dev.zip
            dist/ColorOS-Monet-v2-dev.zip.sha256
            build/components/*.cmonet
          retention-days: 30

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/audit_repository.py
      - run: python tools/validate_mappings.py
      - run: python tools/test_runtime_safety.py
      - run: shellcheck module/customize.sh module/service.sh module/action.sh module/uninstall.sh module/bin/coloros-monet-doctor

  build-debug:
    runs-on: ubuntu-latest
    needs: validate
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: >-
          python tools/build_overlays.py
          --variant debug
          --version-name dev-${{ github.run_number }}
          --version-code ${{ github.run_number }}
      - run: >-
          python tools/package_module.py
          --variant debug
          --version dev-${{ github.run_number }}
          --version-code ${{ github.run_number }}
          --output dist/ColorOS-Monet-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-Monet-debug
          path: |
            dist/ColorOS-Monet-dev.zip
            overlays/*/build/outputs/apk/debug/*.apk

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/audit_repository.py
      - run: python tools/validate_mappings.py
      - run: python tools/test_runtime_safety.py
      - run: shellcheck module/customize.sh module/service.sh module/action.sh module/uninstall.sh module/bin/coloros-monet-doctor

  build-debug:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: >-
          python tools/build_overlays.py
          --variant debug
          --version-name dev-${{ github.run_number }}
          --version-code ${{ github.run_number }}
      - run: >-
          python tools/package_module.py
          --variant debug
          --version dev-${{ github.run_number }}
          --version-code ${{ github.run_number }}
          --output dist/ColorOS-Monet-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-Monet-debug
          path: |
            dist/ColorOS-Monet-dev.zip
            overlays/*/build/outputs/apk/debug/*.apk

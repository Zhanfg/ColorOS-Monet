name: Android 17 compatibility

on:
  push:
    branches:
      - "android17-compat-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-settings-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 17 SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          AVAILABLE="$("$SDKMANAGER" --list --channel=3)"
          printf '%s\n' "$AVAILABLE" | grep -E 'platforms;android-37|build-tools;37\.' || true
          printf '%s\n' "$AVAILABLE" | grep -q '^platforms;android-37[[:space:]]' || {
            echo "Android 17 platform is not visible to sdkmanager" >&2
            exit 1
          }
          BUILD_TOOLS="$(printf '%s\n' "$AVAILABLE" | awk '/^build-tools;37\./ {print $1}' | sort -V | tail -n 1)"
          [ -n "$BUILD_TOOLS" ] || {
            echo "Android Build-Tools 37.x is not visible to sdkmanager" >&2
            exit 1
          }
          "$SDKMANAGER" --channel=3 "platforms;android-37" "$BUILD_TOOLS"
      - run: >-
          python tools/build_coloros17_hotfix.py
          --version 0.1.5-beta
          --version-code 26100301
          --output dist/ColorOS-Monet-COS17-hotfix.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-Monet-COS17-hotfix
          path: |
            dist/ColorOS-Monet-COS17-hotfix.zip
            overlays/coloros-settings17/build/outputs/ColorOSSettings17Compat.apk

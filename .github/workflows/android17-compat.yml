name: Android 17 compatibility

on:
  push:
    branches:
      - "android17-compat-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-settings-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 17 SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - run: >-
          python tools/build_coloros17_hotfix.py
          --version 0.1.5-beta
          --version-code 26100301
          --output dist/ColorOS-Monet-COS17-hotfix.zip
      - name: Stage Android build tools
        shell: bash
        run: |
          mkdir -p dist/sdk-tools/lib
          BT=/usr/local/lib/android/sdk/build-tools/37.0.0
          cp "$BT/aapt2" dist/sdk-tools/aapt2
          cp "$BT/zipalign" dist/sdk-tools/zipalign
          cp "$BT/apksigner" dist/sdk-tools/apksigner
          cp "$BT/lib/apksigner.jar" dist/sdk-tools/lib/apksigner.jar
          chmod +x dist/sdk-tools/aapt2 dist/sdk-tools/zipalign dist/sdk-tools/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS-Monet-COS17-hotfix
          path: |
            dist/ColorOS-Monet-COS17-hotfix.zip
            overlays/coloros-settings17/build/outputs/ColorOSSettings17Compat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android37-build-tools-linux
          path: dist/sdk-tools/

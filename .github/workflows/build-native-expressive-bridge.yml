name: Build native expressive bridge

on:
  push:
    branches:
      - "android17-md3e-*"
    paths:
      - "lsp/native-expressive-bridge/**"
      - ".github/workflows/build-native-expressive-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Install Android 17 SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Build
        run: gradle -p lsp/native-expressive-bridge :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-Native-Expressive-Bridge
          path: lsp/native-expressive-bridge/app/build/outputs/apk/release/*.apk

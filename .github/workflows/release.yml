name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: python tools/validate_mappings.py
      - run: python tools/build_component_sources.py
      - run: |
          python tools/compile_component_assets.py \
            --sources build/component-src --output build/component-compiled \
            --aapt2 "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" \
            --android-jar "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
      - run: cargo build --manifest-path runtime/Cargo.toml --release
      - run: |
          python tools/build_components.py --monetctl runtime/target/release/monetctl \
            --sources build/component-compiled --output build/components
          python tools/audit_components.py build/components
      - name: Cross-compile runtime
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo build --manifest-path runtime/Cargo.toml --release --target aarch64-linux-android
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          python tools/package_module.py \
            --runtime runtime/target/aarch64-linux-android/release/monetctl \
            --components build/components --version "$VERSION" --version-code "$VERSION_CODE" \
            --output "dist/ColorOS-Monet-${GITHUB_REF_NAME}.zip"
          python tools/audit_module.py "dist/ColorOS-Monet-${GITHUB_REF_NAME}.zip"
          sha256sum "dist/ColorOS-Monet-${GITHUB_REF_NAME}.zip" > "dist/ColorOS-Monet-${GITHUB_REF_NAME}.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            build/components/*.cmonet

name: ColorOS 17 MD3E policy guard

on:
  push:
    branches:
      - "android17-md3e-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate native-first token policy
        run: python tools/audit_coloros17_ui_tokens.py overlays
      - name: Repository clean-room audit
        run: python tools/audit_repository.py

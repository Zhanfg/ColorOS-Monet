name: ART+ Auto Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cos17-artplus-auto-compiler
    paths:
      - "artplus-auto/**"
      - ".github/workflows/artplus-auto.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify local toolchain
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if ! command -v kotlinc >/dev/null 2>&1; then
            curl -fsSL -o /tmp/kotlin.zip               https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
            unzip -q /tmp/kotlin.zip -d /tmp/kotlin
            echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          fi

      - name: Compile, package, sign and verify
        shell: bash
        run: bash artplus-auto/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-ARTPlus-Auto-alpha1
          path: |
            artplus-auto/dist/ColorOS17-ARTPlus-Auto-0.1.0-alpha1.apk
            artplus-auto/dist/SHA256SUMS.txt
          if-no-files-found: error

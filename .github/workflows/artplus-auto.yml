name: ART+ Auto Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cos17-artplus-auto-compiler
    paths:
      - "artplus-auto/**"
      - ".github/workflows/artplus-auto.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Lint and build
        run: gradle -p artplus-auto :app:lintDebug :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp artplus-auto/app/build/outputs/apk/debug/app-debug.apk dist/ColorOS17-ARTPlus-Auto-0.1.0-alpha1.apk
          sha256sum dist/ColorOS17-ARTPlus-Auto-0.1.0-alpha1.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-ARTPlus-Auto-alpha1
          path: |
            dist/ColorOS17-ARTPlus-Auto-0.1.0-alpha1.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

name: Build ColorOS ART+ Auto

on:
  workflow_dispatch:
  push:
    branches:
      - feat/artplus-auto-coloros17
    paths:
      - "artplus-companion/**"
      - "tools/build_artplus_companion.py"
      - ".github/workflows/artplus-auto.yml"
  pull_request:
    paths:
      - "artplus-companion/**"
      - "tools/build_artplus_companion.py"
      - ".github/workflows/artplus-auto.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build companion APK
        run: python3 tools/build_artplus_companion.py --variant debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS-ARTPlus-Auto-debug
          path: artplus-companion/build/outputs/ColorOS-ARTPlus-Auto-debug.apk
          if-no-files-found: error

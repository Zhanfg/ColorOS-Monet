name: ART+ Auto Compiler

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cos17-artplus-auto-compiler
    paths:
      - "artplus-auto/**"
      - ".github/workflows/artplus-auto.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Lint and build
        run: gradle -p artplus-auto :app:lintDebug :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp artplus-auto/app/build/outputs/apk/debug/app-debug.apk dist/ColorOS17-ARTPlus-Auto-0.1.0-alpha1.apk
          sha256sum dist/ColorOS17-ARTPlus-Auto-0.1.0-alpha1.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS17-ARTPlus-Auto-alpha1
          path: |
            dist/ColorOS17-ARTPlus-Auto-0.1.0-alpha1.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
